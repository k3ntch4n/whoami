<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Savoir Islam 1024x500</title>
<style>
  @font-face { font-family: 'Amiri'; font-weight: 700; src: url(fonts/amiri-arabic.woff2) format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 700; src: url(fonts/cormorant-700.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url(fonts/inter.woff2) format('woff2'); }
  :root {
    --bg1: #0b3d2e;
    --bg2: #06261c;
    --gold: #d9b45a;
    --gold-light: #f3dfa2;
    --cream: #f7f1e1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; background: var(--bg2); }
  .banner {
    position: relative;
    width: 1024px; height: 500px;
    background: radial-gradient(ellipse at 72% 50%, #145c45 0%, var(--bg1) 45%, var(--bg2) 100%);
    overflow: hidden;
    font-family: 'Inter', 'DejaVu Sans', sans-serif;
  }
  .pattern { position: absolute; inset: 0; opacity: .16; }
  .fade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--bg2) 0%, rgba(6,38,28,.85) 40%, rgba(6,38,28,0) 75%);
  }
  .frame {
    position: absolute; inset: 18px;
    border: 1.5px solid rgba(217,180,90,.45);
    border-radius: 4px;
  }
  .frame::after {
    content: ""; position: absolute; inset: 6px;
    border: 1px solid rgba(217,180,90,.2);
  }
  .content {
    position: absolute; left: 78px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
    width: 560px;
  }
  .arabic {
    font-family: 'Amiri', serif; font-weight: 700;
    color: var(--gold); font-size: 44px; line-height: 1;
    direction: rtl; text-align: left; margin-bottom: 14px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 700;
    font-size: 104px; line-height: .92; color: var(--cream);
    letter-spacing: .5px;
  }
  h1 span {
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 18px; width: 340px;
  }
  .divider i { flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
  .divider i:first-child { background: linear-gradient(270deg, var(--gold), transparent); }
  .divider svg { width: 18px; height: 18px; }
  .tagline {
    color: rgba(247,241,225,.88); font-size: 23px; font-weight: 400;
    letter-spacing: .3px;
  }
  .tagline b { color: var(--gold-light); font-weight: 500; }
  .emblem { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); width: 340px; height: 340px; }
</style>
</head>
<body>
<div class="banner">
  <!-- Motif géométrique : étoiles à 8 branches en tessellation -->
  <svg class="pattern" width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="p" width="80" height="80" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#d9b45a" stroke-width="1.2">
          <rect x="20" y="20" width="40" height="40"/>
          <rect x="20" y="20" width="40" height="40" transform="rotate(45 40 40)"/>
          <circle cx="40" cy="40" r="9"/>
          <path d="M0 0 L20 20 M80 0 L60 20 M0 80 L20 60 M80 80 L60 60"/>
          <path d="M40 0 L40 11.7 M40 80 L40 68.3 M0 40 L11.7 40 M80 40 L68.3 40"/>
        </g>
      </pattern>
    </defs>
    <rect width="1024" height="500" fill="url(#p)"/>
  </svg>
  <div class="fade"></div>

  <!-- Emblème : rosace + croissant -->
  <svg class="emblem" viewBox="-170 -170 340 340" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="-1" x2="0" y2="1">
        <stop offset="0" stop-color="#f3dfa2"/>
        <stop offset="1" stop-color="#b8903a"/>
      </linearGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#f3dfa2" stop-opacity=".35"/>
        <stop offset="1" stop-color="#f3dfa2" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle r="170" fill="url(#glow)"/>
    <g fill="none" stroke="url(#g)" stroke-width="2">
      <circle r="150"/>
      <circle r="142" stroke-width="1" opacity=".6"/>
      <rect x="-104" y="-104" width="208" height="208"/>
      <rect x="-104" y="-104" width="208" height="208" transform="rotate(45)"/>
      <rect x="-104" y="-104" width="208" height="208" transform="rotate(22.5)" opacity=".45" stroke-width="1.2"/>
      <rect x="-104" y="-104" width="208" height="208" transform="rotate(67.5)" opacity=".45" stroke-width="1.2"/>
      <circle r="92" stroke-width="1.2" opacity=".7"/>
    </g>
    <!-- Croissant -->
    <mask id="m">
      <rect x="-170" y="-170" width="340" height="340" fill="#fff"/>
      <circle cx="22" cy="-12" r="54" fill="#000"/>
    </mask>
    <circle r="64" fill="url(#g)" mask="url(#m)"/>
    <!-- Petite étoile -->
    <g transform="translate(34 -8)" fill="url(#g)">
      <rect x="-9" y="-9" width="18" height="18"/>
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"/>
    </g>
  </svg>

  <div class="frame"></div>

  <div class="content">
    <div class="arabic">طلب العلم</div>
    <h1>Savoir<br><span>Islam</span></h1>
    <div class="divider">
      <i></i>
      <svg viewBox="-10 -10 20 20"><g fill="#d9b45a"><rect x="-5" y="-5" width="10" height="10"/><rect x="-5" y="-5" width="10" height="10" transform="rotate(45)"/></g></svg>
      <i></i>
    </div>
    <p class="tagline">Apprendre, comprendre et <b>vivre sa foi</b></p>
  </div>
</div>
</body>
</html>
