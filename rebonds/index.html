<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rebonds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#c4c6bf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: a handheld console — HUD strip, LCD screen that fills the free height, chunky buttons under it. Single deliberate look (LCD on grey plastic). */
:root {
  --plastic: #c4c6bf;
  --plastic-dark: #a9aba3;
  --bezel: #1c1e1a;
  --lcd: #a6af8a;
  --ink: #1f2418;
  --key: #d2552d;
  --key-dark: #8f3519;
  --label: #4a4d45;
  --font-lcd: "Silkscreen", ui-monospace, "Courier New", monospace;
  --font-ui: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  background: var(--plastic);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.shell {
  height: 100%;
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px;
  padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin: 0 auto;
}
.bezel {
  flex: 1; min-height: 0;
  background: var(--bezel);
  border-radius: 10px 10px 34px 10px;
  padding: 12px 12px 8px;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 2px 0 var(--plastic-dark);
}
.hud {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  background: var(--lcd); color: var(--ink);
  font-family: var(--font-lcd); font-size: 15px;
  padding: 6px 10px 5px;
  border-bottom: 2px solid var(--ink);
  font-variant-numeric: tabular-nums;
  border-radius: 3px 3px 0 0;
}
.hud .mid { text-align: center; }
.hud .right { text-align: right; }
.screen {
  flex: 1; min-height: 0; position: relative;
  background: var(--lcd);
  display: flex; align-items: center; justify-content: center;
  border-radius: 0 0 3px 3px;
  overflow: hidden;
}
canvas { display: block; touch-action: none; }
.brand {
  font-family: var(--font-ui); font-weight: 700; font-style: italic;
  color: #e9eae4; text-align: center; font-size: 13px; letter-spacing: .12em;
  text-transform: uppercase;
}
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(166,175,138,.86);
  font-family: var(--font-lcd); text-align: center; padding: 16px;
}
.overlay h2 { margin: 0; font-size: 26px; font-weight: 700; text-wrap: balance; }
.overlay p { margin: 0; font-size: 15px; line-height: 1.5; }
.overlay .lcd-btn {
  font-family: var(--font-lcd); font-size: 16px; color: var(--lcd); background: var(--ink);
  border: 0; padding: 10px 18px; cursor: pointer;
}
.overlay .big { font-size: 40px; line-height: 1.1; }
.overlay.win { background: rgba(166,175,138,.6); }
.overlay.win h2 { font-size: 30px; background: var(--ink); color: var(--lcd); padding: 6px 12px; animation: blink .5s steps(1) 6; }
@keyframes blink { 50% { background: transparent; color: var(--ink); } }
@media (prefers-reduced-motion: reduce) { .overlay.win h2 { animation: none; } }
.controls {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
}
.key {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border: 0; padding: 0; cursor: pointer;
  font-family: var(--font-ui); font-weight: 500; font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--label);
}
.key .cap {
  width: 100%; max-width: 92px; height: 30px; border-radius: 8px;
  background: var(--key);
  box-shadow: 0 3px 0 var(--key-dark), inset 0 1px 0 rgba(255,255,255,.25);
  transition: transform .06s, box-shadow .06s;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-lcd); font-size: 13px; color: #fbe3d8; text-transform: none; letter-spacing: 0;
}
.key:active .cap { transform: translateY(3px); box-shadow: 0 0 0 var(--key-dark); }
.key:disabled { opacity: .45; cursor: default; }
.key:disabled .cap { transform: none; }
.key:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 8px; }
.key.armed .cap { background: var(--ink); color: var(--lcd); box-shadow: 0 3px 0 #000; }
@media (max-height: 560px) { .brand { display: none; } .key .cap { height: 24px; } }
</style>
</head>
<body>

<div class="shell">
  <div class="bezel">
    <div class="hud" aria-live="polite">
      <span id="hud-level">Niv 1</span>
      <span class="mid" id="hud-balls">x1</span>
      <span class="right" id="hud-best">Rec 1</span>
    </div>
    <div class="screen" id="screen">
      <canvas id="game" aria-label="Plateau de jeu : glisse le doigt pour viser, relâche pour tirer"></canvas>
      <div class="overlay" id="over" hidden>
        <h2 id="over-title">Partie finie</h2>
        <p id="over-text">Niveau 1</p>
        <button class="lcd-btn" id="btn-replay" type="button">Rejouer</button>
      </div>
    </div>
    <div class="brand">Rebonds</div>
  </div>
  <div class="controls">
    <button class="key" id="btn-recall" type="button" disabled><span class="cap">&#8595;</span>Rappel</button>
    <button class="key" id="btn-fast" type="button"><span class="cap" id="fast-cap">x1</span>Vitesse</button>
    <button class="key" id="btn-sound" type="button"><span class="cap" id="sound-cap">on</span>Son</button>
    <button class="key" id="btn-new" type="button"><span class="cap" id="new-cap">&#8635;</span>Nouveau</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  // ---------- constants (board units) ----------
  const COLS = 7, ROWS = 9, CELL = 60, GAP = 3;
  const TOP = 6;
  const W = COLS * CELL;
  const MIN_H = TOP + ROWS * CELL + CELL + 8;
  let H = MIN_H, FLOOR = H - 8; // the ground follows the screen height
  const R = 7.5;                 // ball radius
  const SPEED = 15;              // px per frame at x1
  const SUB = 3;                 // substeps per frame (5px each, < R)
  const LAUNCH_GAP = 4;          // frames between two balls
  const MIN_ANGLE = 0.13;        // radians from horizontal
  const SAVE_KEY = "rebonds.v1";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const screenEl = document.getElementById("screen");
  const $ = (id) => document.getElementById(id);

  // ---------- state ----------
  let S;          // persistent game state
  let balls = []; // flying balls
  let mode = "aim"; // aim | shoot | shift | over
  let toLaunch = 0, launchTimer = 0, nextX = null, gained = 0, turnFrames = 0;
  let aim = null;  // {x,y} pointer while aiming
  let shiftT = 0;
  let fast = 1;
  let sound = true;
  let particles = [];
  let scale = 1, dpr = 1;

  const emptyRow = () => new Array(COLS).fill(0);

  function freshState() {
    const bestScore = (S && S.bestScore) || 0;
    return { level: 1, balls: 1, launchX: W / 2, best: (S && S.best) || 1,
      score: 0, bestScore, startBest: bestScore, recordShown: false,
      vals: Array.from({ length: ROWS + 1 }, emptyRow),
      bricks: Array.from({ length: ROWS + 1 }, emptyRow),
      picks: Array.from({ length: ROWS + 1 }, emptyRow) };
  }

  function spawnRow(level) {
    const cols = [...Array(COLS).keys()].sort(() => Math.random() - 0.5);
    const pickCol = cols.shift();
    S.picks[0][pickCol] = 1;
    const maxN = level < 4 ? 3 : level < 15 ? 5 : 6;
    const n = 1 + Math.floor(Math.random() * maxN);
    for (let i = 0; i < n; i++) {
      const double = level > 5 && Math.random() < 0.22;
      S.vals[0][cols[i]] = S.bricks[0][cols[i]] = double ? level * 2 : level;
    }
  }

  function shiftDown() {
    S.bricks.pop(); S.bricks.unshift(emptyRow());
    S.picks.pop(); S.picks.unshift(emptyRow());
    S.vals.pop(); S.vals.unshift(emptyRow());
    spawnRow(S.level);
    // pickups that reach the launch row are given to the player
    for (let c = 0; c < COLS; c++) if (S.picks[ROWS][c]) { S.picks[ROWS][c] = 0; S.balls++; }
    shiftT = 1; mode = "shift";
  }

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ S, sound })); } catch (e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function validState(s) {
    return s && Array.isArray(s.bricks) && s.bricks.length === ROWS + 1 && Array.isArray(s.picks) && s.level >= 1;
  }

  // ---------- audio ----------
  let actx = null, lastBeep = 0;
  function beep(freq, dur, vol) {
    if (!sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      if (t - lastBeep < 0.03) return;
      lastBeep = t;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // ---------- physics ----------
  // returns true if the ball hit something solid (for the aim preview)
  function collideBricks(b, dry) {
    let hit = false;
    const c0 = Math.max(0, Math.floor((b.x - R) / CELL)), c1 = Math.min(COLS - 1, Math.floor((b.x + R) / CELL));
    const r0 = Math.max(0, Math.floor((b.y - R - TOP) / CELL)), r1 = Math.min(ROWS, Math.floor((b.y + R - TOP) / CELL));
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (S.picks[r][c] && !dry) {
        const px = c * CELL + CELL / 2, py = TOP + r * CELL + CELL / 2;
        if ((b.x - px) ** 2 + (b.y - py) ** 2 < (R + 11) ** 2) {
          S.picks[r][c] = 0; gained++; beep(1320, 0.08, 0.05);
          burst(px, py, 6);
        }
      }
      if (!S.bricks[r][c]) continue;
      const x0 = c * CELL + GAP / 2, x1 = (c + 1) * CELL - GAP / 2;
      const y0 = TOP + r * CELL + GAP / 2, y1 = TOP + (r + 1) * CELL - GAP / 2;
      const cx = Math.min(Math.max(b.x, x0), x1), cy = Math.min(Math.max(b.y, y0), y1);
      let dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
      if (d2 >= R * R) continue;
      let nx, ny;
      if (d2 === 0) { // center inside: push out through the closest face
        const pen = [b.x - x0, x1 - b.x, b.y - y0, y1 - b.y];
        const m = pen.indexOf(Math.min(...pen));
        nx = m === 0 ? -1 : m === 1 ? 1 : 0; ny = m === 2 ? -1 : m === 3 ? 1 : 0;
        b.x = m === 0 ? x0 - R : m === 1 ? x1 + R : b.x;
        b.y = m === 2 ? y0 - R : m === 3 ? y1 + R : b.y;
      } else {
        const d = Math.sqrt(d2); nx = dx / d; ny = dy / d;
        b.x = cx + nx * R; b.y = cy + ny * R;
      }
      const dot = b.vx * nx + b.vy * ny;
      if (dot < 0) {
        b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
        hit = true;
        if (!dry) damage(r, c);
      }
    }
    return hit;
  }

  function fixAngle(b) {
    const sp = Math.hypot(b.vx, b.vy) || 1;
    let vx = b.vx / sp, vy = b.vy / sp;
    const minY = Math.sin(MIN_ANGLE);
    if (Math.abs(vy) < minY) {
      vy = (vy < 0 ? -1 : 1) * minY;
      vx = Math.sign(vx || 1) * Math.sqrt(1 - vy * vy);
    }
    b.vx = vx * SPEED / SUB; b.vy = vy * SPEED / SUB;
  }

  let recordBanner = 0, winTimer = 0;
  function addScore(n) {
    S.score += n;
    if (S.score > S.bestScore) {
      S.bestScore = S.score;
      if (!S.recordShown && S.startBest > 0) {
        S.recordShown = true; recordBanner = 150;
        fanfare();
      }
    }
  }
  function fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => { lastBeep = 0; beep(f, 0.16, 0.06); }, i * 120));
  }

  function damage(r, c) {
    S.bricks[r][c]--;
    addScore(1);
    const key = r * COLS + c;
    flashes.set(key, 6);
    if (S.bricks[r][c] <= 0) {
      S.bricks[r][c] = 0;
      addScore(S.vals[r][c] || 0); S.vals[r][c] = 0;
      burst(c * CELL + CELL / 2, TOP + r * CELL + CELL / 2, 10);
      beep(220, 0.12, 0.06);
    } else beep(660 + Math.random() * 80, 0.04, 0.035);
  }
  const flashes = new Map();

  function stepBall(b, dry) {
    b.x += b.vx; b.y += b.vy;
    let bounced = false;
    if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); bounced = true; }
    else if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); bounced = true; }
    if (b.y < R) { b.y = R; b.vy = Math.abs(b.vy); bounced = true; }
    if (collideBricks(b, dry)) bounced = true;
    if (bounced) fixAngle(b);
    return bounced;
  }

  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 26 + Math.random() * 14 });
    }
  }

  // ---------- aiming ----------
  function aimDir() {
    if (!aim) return null;
    const lx = S.launchX, ly = FLOOR - R;
    const dx = aim.x - lx, dy = aim.y - ly;
    if (dy > -8) return null; // finger must be above the launcher
    let ang = Math.atan2(-dy, dx);
    ang = Math.min(Math.max(ang, MIN_ANGLE), Math.PI - MIN_ANGLE);
    return { x: Math.cos(ang), y: -Math.sin(ang) };
  }

  function previewPath(dir) {
    const g = { x: S.launchX, y: FLOOR - R, vx: dir.x * SPEED / SUB, vy: dir.y * SPEED / SUB };
    const pts = [];
    let after = -1;
    for (let i = 0; i < 900; i++) {
      if (stepBall(g, true) && after < 0) after = 0;
      if (g.y > FLOOR - R) break;
      if (after >= 0 && ++after > 40) break;
      if (i % 5 === 4) pts.push(g.x, g.y);
    }
    return pts;
  }

  function fire(dir) {
    balls = [];
    toLaunch = S.balls; launchTimer = 0; nextX = null; gained = 0; turnFrames = 0;
    shotDir = dir; mode = "shoot";
    $("btn-recall").disabled = false;
  }
  let shotDir = null;

  function recall() {
    if (mode !== "shoot") return;
    toLaunch = 0;
    for (const b of balls) if (!b.home) { b.home = true; if (nextX === null) nextX = b.x; }
  }

  function endTurn() {
    S.balls += gained; gained = 0;
    if (nextX !== null) S.launchX = Math.min(Math.max(nextX, R), W - R);
    S.level++;
    if (S.level > S.best) S.best = S.level;
    balls = [];
    $("btn-recall").disabled = true;
    shiftDown();
  }

  function finishShift() {
    for (let c = 0; c < COLS; c++) if (S.bricks[ROWS][c]) { gameOver(); return; }
    mode = "aim";
    save();
  }

  function gameOver() {
    mode = "over";
    const won = S.score > S.startBest && S.score > 0;
    $("over-title").textContent = won ? "Record battu !" : "Partie finie";
    $("over-text").innerHTML = won
      ? `<strong class="big">${S.score}</strong><br>points<br>ancien record : ${S.startBest}`
      : `<strong class="big">${S.score}</strong><br>points · niveau ${S.level}<br>record : ${S.bestScore}`;
    $("over").classList.toggle("win", won);
    $("over").hidden = false;
    if (won) { fanfare(); winTimer = 150; } else beep(110, 0.5, 0.07);
    S = freshState();
    save(); // the next launch starts a new game
  }

  function newGame() {
    const best = S ? S.best : 1;
    S = freshState(); S.best = best;
    balls = []; particles = []; flashes.clear();
    $("over").hidden = true;
    $("btn-recall").disabled = true;
    spawnRow(1); shiftT = 1; mode = "shift";
    // move first row down one so the top stays clear
    S.bricks.pop(); S.bricks.unshift(emptyRow());
    S.picks.pop(); S.picks.unshift(emptyRow());
    S.vals.pop(); S.vals.unshift(emptyRow());
  }

  // ---------- update ----------
  function frame() {
    if (mode === "shift") {
      shiftT = Math.max(0, shiftT - 0.09 * fast);
      if (shiftT === 0) finishShift();
    } else if (mode === "shoot") {
      for (let k = 0; k < fast; k++) simFrame();
    }
    if (recordBanner > 0) recordBanner--;
    if (winTimer > 0 && winTimer-- % 12 === 0) burst(40 + Math.random() * (W - 80), 60 + Math.random() * H * 0.5, 16);
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life--; }
    particles = particles.filter((p) => p.life > 0);
    for (const [k, v] of flashes) { if (v <= 1) flashes.delete(k); else flashes.set(k, v - 1); }
  }

  function simFrame() {
    turnFrames++;
    if (toLaunch > 0 && --launchTimer <= 0) {
      balls.push({ x: S.launchX, y: FLOOR - R, vx: shotDir.x * SPEED / SUB, vy: shotDir.y * SPEED / SUB, home: false });
      toLaunch--; launchTimer = LAUNCH_GAP;
    }
    let flying = 0;
    for (const b of balls) {
      if (b.home) {
        const tx = nextX ?? b.x;
        b.x += (tx - b.x) * 0.25; b.y = FLOOR - R;
        continue;
      }
      flying++;
      for (let s = 0; s < SUB; s++) {
        stepBall(b, false);
        if (b.vy > 0 && b.y >= FLOOR - R) {
          b.y = FLOOR - R; b.home = true;
          if (nextX === null) nextX = b.x;
          break;
        }
      }
    }
    if (toLaunch === 0 && flying === 0 && balls.every((b) => b.home)) endTurn();
  }

  // ---------- render ----------
  const INK = "#1f2418", LCD = "#a6af8a";
  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.fillStyle = LCD; ctx.fillRect(0, 0, W, H);

    // ground line + danger hint
    ctx.fillStyle = "rgba(31,36,24,.35)";
    for (let x = 4; x < W; x += 14) ctx.fillRect(x, TOP + ROWS * CELL, 7, 2);
    ctx.fillStyle = INK;
    ctx.fillRect(0, FLOOR, W, 2);

    const off = -shiftT * CELL;
    const lvl = Math.max(1, S.level);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let r = 0; r <= ROWS; r++) for (let c = 0; c < COLS; c++) {
      const y = TOP + r * CELL + off;
      const hp = S.bricks[r][c];
      if (hp) {
        const x0 = c * CELL + GAP + 2, s = CELL - 2 * GAP - 4;
        const fl = flashes.get(r * COLS + c);
        ctx.lineWidth = fl ? 5 : 3; ctx.strokeStyle = INK;
        ctx.strokeRect(x0, y + GAP + 2, s, s);
        ctx.fillStyle = INK;
        const fs = hp >= 1000 ? 15 : hp >= 100 ? 18 : 22;
        ctx.font = `700 ${fs}px Silkscreen, ui-monospace, monospace`;
        ctx.fillText(String(hp), c * CELL + CELL / 2, y + CELL / 2 + 1);
      }
      if (S.picks[r][c]) {
        const pulse = 1 + Math.sin(performance.now() / 180) * 0.12;
        const px = c * CELL + CELL / 2, py = y + CELL / 2;
        ctx.lineWidth = 3; ctx.strokeStyle = INK;
        ctx.beginPath(); ctx.arc(px, py, 11 * pulse, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
      }
    }

    // aim preview
    if (mode === "aim" && aim) {
      const dir = aimDir();
      if (dir) {
        const pts = previewPath(dir);
        ctx.fillStyle = INK;
        for (let i = 0; i < pts.length; i += 2) {
          const a = 1 - i / pts.length * 0.7;
          ctx.globalAlpha = a;
          ctx.beginPath(); ctx.arc(pts[i], pts[i + 1], 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    // balls
    ctx.fillStyle = INK;
    let landed = 0;
    for (const b of balls) {
      if (b.home) { landed++; continue; }
      ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill();
    }

    // launcher
    const showLauncher = mode === "aim" || mode === "shift" || (mode === "shoot" && toLaunch > 0);
    if (showLauncher) {
      ctx.beginPath(); ctx.arc(S.launchX, FLOOR - R, R, 0, Math.PI * 2); ctx.fill();
      const count = mode === "shoot" ? toLaunch : S.balls;
      ctx.font = "700 14px Silkscreen, ui-monospace, monospace";
      const lx = Math.min(Math.max(S.launchX, 30), W - 30);
      ctx.fillText("x" + count, lx, FLOOR - R - 22);
    }
    if (mode === "shoot" && nextX !== null && landed > 0) {
      ctx.beginPath(); ctx.arc(nextX, FLOOR - R, R, 0, Math.PI * 2); ctx.fill();
      if (!(toLaunch > 0 && Math.abs(nextX - S.launchX) < 50)) {
        ctx.font = "700 14px Silkscreen, ui-monospace, monospace";
        ctx.fillText("x" + landed, Math.min(Math.max(nextX, 30), W - 30), FLOOR - R - 22);
      }
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life / 20);
      ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5);
    }
    ctx.globalAlpha = 1;

    if (recordBanner > 0 && Math.floor(recordBanner / 12) % 2 === 0) {
      const by = (TOP + ROWS * CELL + FLOOR) / 2 - 18;
      ctx.fillStyle = INK; ctx.fillRect(W / 2 - 130, by - 20, 260, 40);
      ctx.fillStyle = LCD; ctx.font = "700 20px Silkscreen, ui-monospace, monospace";
      ctx.fillText("NOUVEAU RECORD", W / 2, by + 1);
      ctx.fillStyle = INK;
    }

    $("hud-level").textContent = "Niv " + S.level;
    $("hud-balls").textContent = S.score;
    $("hud-best").textContent = "Rec " + S.bestScore;
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { frame(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }

  function resize() {
    const cw = screenEl.clientWidth, ch = screenEl.clientHeight;
    scale = Math.min(cw / W, ch / MIN_H);
    H = Math.max(MIN_H, Math.floor(ch / scale));
    FLOOR = H - 8;
    for (const b of balls) if (b.home || b.y > FLOOR - R) b.y = FLOOR - R;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
  }

  // ---------- input ----------
  function toBoard(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (mode !== "aim") return;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    aim = toBoard(e);
    if (sound && !actx) beep(1, 0.001, 0.0001);
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", (e) => { if (aim && mode === "aim") aim = toBoard(e); });
  const release = (e) => {
    if (!aim) return;
    if (e.type === "pointerup" && mode === "aim") {
      aim = toBoard(e);
      const dir = aimDir();
      if (dir) fire(dir);
    }
    aim = null;
  };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  $("btn-recall").addEventListener("click", recall);
  $("btn-fast").addEventListener("click", () => {
    fast = fast === 1 ? 2 : fast === 2 ? 4 : 1;
    $("fast-cap").textContent = "x" + fast;
  });
  $("btn-sound").addEventListener("click", () => {
    sound = !sound; $("sound-cap").textContent = sound ? "on" : "off"; save();
  });
  let newArmed = 0;
  $("btn-new").addEventListener("click", () => {
    const btn = $("btn-new");
    if (mode === "over" || Date.now() - newArmed < 2500) {
      newArmed = 0; btn.classList.remove("armed"); $("new-cap").innerHTML = "&#8635;";
      newGame(); return;
    }
    newArmed = Date.now(); btn.classList.add("armed"); $("new-cap").textContent = "sûr ?";
    setTimeout(() => { if (newArmed && Date.now() - newArmed >= 2400) { newArmed = 0; btn.classList.remove("armed"); $("new-cap").innerHTML = "&#8635;"; } }, 2600);
  });
  $("btn-replay").addEventListener("click", newGame);
  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(screenEl);

  // ---------- boot ----------
  function start(data) {
    const saved = (data && data.S && data) || load();
    if (saved && validState(saved.S)) {
      S = saved.S; sound = saved.sound !== false;
      if (!S.vals) S.vals = S.bricks.map((row) => row.slice());
      if (S.score == null) S.score = 0;
      if (S.bestScore == null) S.bestScore = 0;
      if (S.startBest == null) S.startBest = S.bestScore;
      mode = "aim";
    } else {
      S = null; newGame();
      if (saved && saved.S && saved.S.best) S.best = saved.S.best;
      if (saved && saved.S && saved.S.bestScore) S.bestScore = S.startBest = saved.S.bestScore;
    }
    $("sound-cap").textContent = sound ? "on" : "off";
    resize();
    requestAnimationFrame((t) => { last = t; loop(t); });
  }
  window.claude?.hot?.snapshot?.(() => ({ S, sound }));
  const boot = window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
  document.fonts && document.fonts.load("700 20px Silkscreen").catch(() => {});
})();
</script>
</body>
</html>
