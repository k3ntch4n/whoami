name: Alertes Earth Arcade / Yujin

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut décaler de quelques minutes)
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer seulement un message de test"
        type: boolean
        default: false

concurrency:
  group: kpop-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # l'état (vidéos/articles déjà vus) est conservé dans le cache GitHub, pas dans le dépôt
      - uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: kpop-alerts-state-${{ github.run_id }}
          restore-keys: kpop-alerts-state-

      - name: Vérifier les nouveautés
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test && '1' || '0' }}
        run: python alerts/watch.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('alerts/state.json') != ''
        with:
          path: alerts/state.json
          key: kpop-alerts-state-${{ github.run_id }}
